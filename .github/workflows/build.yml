name: Build & Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  macos:
    strategy:
      matrix:
        arch: [arm64, x64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained
        run: |
          rid="osx-${{ matrix.arch }}"
          dotnet publish AssignSticker_X/AssignSticker_X.csproj \
            -c Release \
            -r "$rid" \
            --self-contained true \
            -p:PublishSingleFile=false \
            -o "publish/$rid"

      - name: Bundle .app
        run: |
          rid="osx-${{ matrix.arch }}"
          app="AssignSticker_X.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp -r "publish/$rid/"* "$app/Contents/MacOS/"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>AssignSticker_X</string>
            <key>CFBundleIdentifier</key><string>com.sectl.assignsticker</string>
            <key>CFBundleName</key><string>AssignSticker_X</string>
            <key>CFBundleVersion</key><string>${{ github.ref_name }}</string>
            <key>CFBundleShortVersionString</key><string>${{ github.ref_name }}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>10.15</string>
          </dict>
          </plist>
          EOF

      - name: Package .pkg
        run: |
          rid="osx-${{ matrix.arch }}"
          pkgbuild \
            --root AssignSticker_X.app \
            --identifier com.sectl.assignsticker \
            --version "${{ github.ref_name }}" \
            --install-location /Applications/AssignSticker_X.app \
            "AssignSticker_X-${{ github.ref_name }}-$rid.pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: AssignSticker_X-${{ github.ref_name }}-osx-${{ matrix.arch }}
          path: "*.pkg"

  windows:
    strategy:
      matrix:
        arch: [x64, x86, arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained
        run: |
          $rid = "win-${{ matrix.arch }}"
          dotnet publish AssignSticker_X/AssignSticker_X.csproj `
            -c Release `
            -r $rid `
            --self-contained true `
            -p:PublishSingleFile=false `
            -o "publish/$rid"

      - name: Package zip
        run: |
          $rid = "win-${{ matrix.arch }}"
          Compress-Archive -Path "publish/$rid/*" `
            -DestinationPath "AssignSticker_X-${{ github.ref_name }}-$rid.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: AssignSticker_X-${{ github.ref_name }}-win-${{ matrix.arch }}
          path: "*.zip"

  linux:
    strategy:
      matrix:
        arch: [x64, x86, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained
        run: |
          rid="linux-${{ matrix.arch }}"
          dotnet publish AssignSticker_X/AssignSticker_X.csproj \
            -c Release \
            -r "$rid" \
            --self-contained true \
            -p:PublishSingleFile=false \
            -o "publish/$rid"

      - name: Package .deb
        run: |
          rid="linux-${{ matrix.arch }}"
          pkg="AssignSticker_X-${{ github.ref_name }}-$rid"
          dir="deb/$pkg"
          mkdir -p "$dir/DEBIAN"
          mkdir -p "$dir/usr/bin"
          mkdir -p "$dir/usr/share/applications"
          mkdir -p "$dir/usr/share/icons/hicolor/256x256/apps"

          cp -r "publish/$rid/"* "$dir/usr/bin/"

          cat > "$dir/DEBIAN/control" <<EOF
          Package: assignsticker-x
          Version: ${{ github.ref_name }}
          Section: utils
          Priority: optional
          Architecture: ${{ matrix.arch == 'x64' && 'amd64' || matrix.arch == 'x86' && 'i386' || 'arm64' }}
          Maintainer: SECTL
          Description: AssignSticker_X - Homework assignment sticker app
          EOF

          cat > "$dir/usr/share/applications/assignsticker-x.desktop" <<EOF
          [Desktop Entry]
          Name=AssignSticker_X
          Exec=/usr/bin/AssignSticker_X
          Type=Application
          Categories=Utility;
          Terminal=false
          EOF

          cp AssignSticker_X/Assets/logo/logo.png \
            "$dir/usr/share/icons/hicolor/256x256/apps/assignsticker-x.png"

          dpkg-deb --build "$dir"
          mv "deb/$pkg.deb" .

      - uses: actions/upload-artifact@v4
        with:
          name: AssignSticker_X-${{ github.ref_name }}-linux-${{ matrix.arch }}
          path: "*.deb"
